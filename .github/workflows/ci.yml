name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, and package
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .

      - name: Check types with mypy
        run: mypy

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: pytest

  coverage-badge:
    name: Update coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install package and development tools
        run: python -m pip install -e '.[dev]'

      - name: Generate coverage report
        run: pytest

      - name: Publish coverage badge and report
        uses: py-cov-action/python-coverage-comment-action@5d8df5979747514c914e1c5a12335a7cf9a2745f # v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: save_coverage_data_files
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 85
